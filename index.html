<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刺绣针法路径与配线色卡编辑器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🧵 刺绣针法编辑器</h1>
            <div class="header-actions">
                <input type="text" id="projectName" placeholder="方案名称" class="project-name-input">
                <button id="saveBtn" class="btn btn-primary">💾 保存</button>
                <button id="loadBtn" class="btn btn-secondary">📂 加载</button>
                <button id="exportPngBtn" class="btn btn-success">🖼️ 导出PNG</button>
                <button id="exportSvgBtn" class="btn btn-success">📐 导出SVG</button>
                <button id="exportJsonBtn" class="btn btn-success">📋 导出JSON</button>
                <button id="generateStepsBtn" class="btn btn-info">📝 生成步骤</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="left-panel">
                <div class="panel-section">
                    <h3>🎨 针法工具</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="running" title="平针">
                            <span class="tool-icon">〰️</span> 平针
                        </button>
                        <button class="tool-btn" data-tool="backstitch" title="回针">
                            <span class="tool-icon">↩️</span> 回针
                        </button>
                        <button class="tool-btn" data-tool="satin" title="缎面针">
                            <span class="tool-icon">▓</span> 缎面针
                        </button>
                        <button class="tool-btn" data-tool="frenchKnot" title="结粒针">
                            <span class="tool-icon">●</span> 结粒针
                        </button>
                        <button class="tool-btn" data-tool="select" title="选择">
                            <span class="tool-icon">↖️</span> 选择
                        </button>
                        <button class="tool-btn" data-tool="eraser" title="橡皮擦">
                            <span class="tool-icon">🧹</span> 橡皮擦
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>🧵 绣线设置</h3>
                    <div class="thread-settings">
                        <div class="setting-row">
                            <label>线号:</label>
                            <input type="text" id="threadNumber" value="DMC 666" placeholder="如: DMC 666">
                        </div>
                        <div class="setting-row">
                            <label>颜色:</label>
                            <input type="color" id="threadColor" value="#ff0000">
                            <span id="colorPreview" class="color-preview" style="background: #ff0000"></span>
                        </div>
                        <div class="setting-row">
                            <label>股数:</label>
                            <select id="threadStrands">
                                <option value="1">1股</option>
                                <option value="2" selected>2股</option>
                                <option value="3">3股</option>
                                <option value="4">4股</option>
                                <option value="6">6股</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label>备注:</label>
                            <input type="text" id="threadNote" placeholder="绣线说明">
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>⚙️ 画布设置</h3>
                    <div class="canvas-settings">
                        <div class="setting-row">
                            <label>网格大小:</label>
                            <input type="range" id="gridSize" min="10" max="50" value="20">
                            <span id="gridSizeValue">20px</span>
                        </div>
                        <div class="setting-row">
                            <label>缩放:</label>
                            <input type="range" id="zoomLevel" min="50" max="300" value="100">
                            <span id="zoomValue">100%</span>
                        </div>
                        <div class="setting-row">
                            <label>
                                <input type="checkbox" id="snapToGrid" checked> 吸附网格
                            </label>
                        </div>
                        <div class="setting-row">
                            <label>
                                <input type="checkbox" id="showGrid" checked> 显示网格
                            </label>
                        </div>
                        <div class="setting-row">
                            <label>底图透明度:</label>
                            <input type="range" id="bgOpacity" min="0" max="100" value="30">
                            <span id="bgOpacityValue">30%</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📷 底图</h3>
                    <div class="bg-image-controls">
                        <input type="file" id="bgImageInput" accept="image/*" style="display: none;">
                        <button id="uploadBgBtn" class="btn btn-secondary">上传底图</button>
                        <button id="clearBgBtn" class="btn btn-danger">清除底图</button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>🔄 操作</h3>
                    <div class="action-buttons">
                        <button id="undoBtn" class="btn btn-secondary" disabled>↶ 撤销</button>
                        <button id="redoBtn" class="btn btn-secondary" disabled>↷ 重做</button>
                        <button id="clearAllBtn" class="btn btn-danger">🗑️ 清空画布</button>
                    </div>
                </div>
            </aside>

            <main class="canvas-container">
                <div class="canvas-wrapper">
                    <canvas id="mainCanvas"></canvas>
                    <canvas id="gridCanvas" class="overlay-canvas"></canvas>
                    <canvas id="drawCanvas" class="overlay-canvas"></canvas>
                    <img id="bgImage" class="bg-image" style="display: none;">
                </div>
            </main>

            <aside class="right-panel">
                <div class="panel-section">
                    <h3>📋 配线清单</h3>
                    <div id="threadList" class="thread-list">
                        <p class="empty-text">暂无绣线</p>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📊 针法统计</h3>
                    <div id="stitchStats" class="stats-list">
                        <div class="stat-item">
                            <span class="stat-label">平针:</span>
                            <span class="stat-value" id="runningCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">回针:</span>
                            <span class="stat-value" id="backstitchCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">缎面针:</span>
                            <span class="stat-value" id="satinCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">结粒针:</span>
                            <span class="stat-value" id="frenchKnotCount">0</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📏 预估用线</h3>
                    <div id="threadLength" class="length-estimate">
                        <div class="length-item">
                            <span class="length-label">总长度:</span>
                            <span class="length-value" id="totalLength">0 cm</span>
                        </div>
                        <div class="length-item">
                            <span class="length-label">预估根数:</span>
                            <span class="length-value" id="totalSkeins">0</span>
                        </div>
                        <p class="hint">每根绣线约8米，计算含损耗</p>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>✏️ 选中路径</h3>
                    <div id="selectedPathInfo" class="selected-info">
                        <p class="empty-text">未选中任何路径</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="stepsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 刺绣步骤说明</h2>
                <button class="close-btn" id="closeStepsModal">&times;</button>
            </div>
            <div class="modal-body" id="stepsContent">
            </div>
            <div class="modal-footer">
                <button id="copyStepsBtn" class="btn btn-primary">复制到剪贴板</button>
            </div>
        </div>
    </div>

    <div id="loadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📂 加载方案</h2>
                <button class="close-btn" id="closeLoadModal">&times;</button>
            </div>
            <div class="modal-body" id="loadContent">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
